[workspace]
resolver = "3"
members = ["proto", "rt"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Enforces the "never crash" rules from CLAUDE.md. `engine/host` will opt out of
# `unsafe_code` locally when it exists; nothing else may.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
