[package]
name = "gorilla-rt"
description = "Audio thread, sequencer and device I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gorilla-engine"
path = "src/main.rs"

[dependencies]
assert_no_alloc = "1.1"
cpal = "0.18"
gorilla-proto = { path = "../proto" }
rtrb = "0.4"
symphonia = { version = "0.6", default-features = false, features = ["wav", "aiff", "pcm", "flac"] }

[lints]
workspace = true
